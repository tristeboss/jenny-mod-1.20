<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Jenny Mod 1.20</title>
    <!-- Czcionka Google & Ikony -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Jasniejsze, rozowo-fioletowe tło gradientowe */
            background: linear-gradient(135deg, #2b0826 0%, #17051a 50%, #3b0a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Neonowa poświata w tle */
        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: #ff1493;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.45;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        /* Główna karta */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(35, 15, 45, 0.75);
            border: 2px solid rgba(255, 105, 180, 0.4);
            border-radius: 24px;
            padding: 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 20, 147, 0.35);
            backdrop-filter: blur(12px);
        }

        /* Kontener na obrazek BEZ CZARNEGO TŁA */
        .image-box {
            width: 100%;
            height: 240px;
            border-radius: 16px;
            background: transparent;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 20, 147, 0.5));
        }

        /* Nagłówek */
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ff69b4;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
        }

        p {
            color: #d1b8dc;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* Przycisk Pobierania */
        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff1493, #b30059);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(255, 20, 147, 0.5);
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.8);
            background: linear-gradient(135deg, #ff33a6, #ff1493);
        }

        /* Informacje dolne */
        .info {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.8rem;
            color: #a892b5;
        }

        .info span i {
            color: #ff69b4;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Obrazek Moda (bez czarnego tła) -->
        <div class="image-box">
            <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fjennymodlatest.com%2Fwp-content%2Fuploads%2F2025%2F06%2FJenny-Mod-6-scale.png&f=1&nofb=1&ipt=606d2e83c17c79029f96dcccecf8022b4ac9c52e54c5be8310cf2a8ae44904e9" alt="Jenny Mod Preview">
        </div>

        <h1>Jenny Mod 1.20</h1>
        <p>Pobierz najnowszą wersję moda dla Minecraft 1.20.</p>

        <!-- Przycisk pobierania pliku .jar z repozytorium -->
        <a href="jenny-mod-1.20.jar" download class="btn-download">
            <i class="fa-solid fa-download"></i> Pobierz Plik (.jar)
        </a>

        <div class="info">
            <span><i class="fa-solid fa-code"></i> Wersja: 1.20</span>
            <span><i class="fa-solid fa-shield"></i> Bezpieczne</span>
        </div>
    </div>

</body>
</html>
