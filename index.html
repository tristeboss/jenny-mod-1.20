<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Jenny Mod 1.20</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0d0a12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* Animowane plamy świetlne w tle */
        .glow-bg {
            position: absolute;
            top: 10%;
            left: 20%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 20, 147, 0.35) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            animation: float 8s ease-in-out infinite alternate;
        }

        .glow-bg-2 {
            position: absolute;
            bottom: 10%;
            right: 20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.25) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(90px);
            z-index: 1;
            animation: float2 10s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(-80px, -50px) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.15); }
        }

        @keyframes float2 {
            0% { transform: translate(50px, 50px) scale(1); }
            100% { transform: translate(-80px, -60px) scale(1.1); }
        }

        /* Postacie po bokach w tle */
        .side-character {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 70vh;
            max-height: 600px;
            opacity: 0.25;
            filter: drop-shadow(0 0 25px rgba(255, 20, 147, 0.6));
            z-index: 2;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .side-character.left {
            left: 5%;
        }

        .side-character.right {
            right: 5%;
            transform: translateY(-50%) scaleX(-1); /* Odbicie lustrzane dla symetrii */
        }

        /* Główna karta (Glassmorphism) */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(20, 15, 28, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 105, 180, 0.25);
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                        0 0 35px rgba(255, 20, 147, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9),
                        0 0 45px rgba(255, 20, 147, 0.35);
        }

        /* Kontener na obrazek (poprawiony, by pokazywał całą postać) */
        .image-banner {
            width: 100%;
            height: 240px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
            border: 1px solid rgba(255, 105, 180, 0.3);
            background: #000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5),
                        0 0 15px rgba(255, 20, 147, 0.25);
        }

        .image-banner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.5s ease;
        }

        .card:hover .image-banner img {
            transform: scale(1.05);
        }

        /* Tytuł */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff, #ff69b4, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.3);
        }

        p {
            color: #b3a3be;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Przyciski */
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #ff1493, #d80073);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(255, 20, 147, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
        }

        .btn-download:hover {
            background: linear-gradient(135deg, #ff33a6, #ff1493);
            transform: scale(1.03);
            box-shadow: 0 15px 35px rgba(255, 20, 147, 0.7),
                        0 0 25px rgba(255, 105, 180, 0.8);
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        /* Szczegóły pliku */
        .file-info {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
            color: #8c7b99;
        }

        .file-info span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .file-info i {
            color: #ff69b4;
        }

        /* UKRYWANIE BOCZNYCH POSTACI NA MNIEJSZYCH EKRANACH */
        @media (max-width: 1024px) {
            .side-character {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Efekty tła -->
    <div class="glow-bg"></div>
    <div class="glow-bg-2"></div>

    <!-- Obrazki po bokach -->
    <img class="side-character left" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fjennymodlatest.com%2Fwp-content%2Fuploads%2F2025%2F06%2FJenny-Mod-6-scale.png&f=1&nofb=1&ipt=606d2e83c17c79029f96dcccecf8022b4ac9c52e54c5be8310cf2a8ae44904e9" alt="Jenny Left">
    <img class="side-character right" src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fjennymodlatest.com%2Fwp-content%2Fuploads%2F2025%2F06%2FJenny-Mod-6-scale.png&f=1&nofb=1&ipt=606d2e83c17c79029f96dcccecf8022b4ac9c52e54c5be8310cf2a8ae44904e9" alt="Jenny Right">

    <!-- Główny Kontener -->
    <div class="card">
        <!-- Obrazek w nagłówku -->
        <div class="image-banner">
            <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fjennymodlatest.com%2Fwp-content%2Fuploads%2F2025%2F06%2FJenny-Mod-6-scale.png&f=1&nofb=1&ipt=606d2e83c17c79029f96dcccecf8022b4ac9c52e54c5be8310cf2a8ae44904e9" alt="Jenny Mod Preview">
        </div>

        <h1>Jenny Mod 1.20</h1>
        <p>Pobierz najnowszą wersję moda bezpośrednio z repozytorium GitHub.</p>

        <!-- Przycisk Pobierania -->
        <a href="jenny-mod-1.20.jar" download class="btn-download">
            <i class="fa-solid fa-download"></i>
            Pobierz Plik (.jar)
        </a>

        <div class="file-info">
            <span><i class="fa-solid fa-file-code"></i> Wersja: 1.20</span>
            <span><i class="fa-solid fa-shield-halved"></i> Bezpieczne</span>
        </div>
    </div>

</body>
</html>
